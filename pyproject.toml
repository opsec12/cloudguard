[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudguard"
version = "0.1.0"
description = "Cloud-agnostic infrastructure posture scanner with attack-path correlation"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
azure = ["azure-identity", "azure-mgmt-authorization", "azure-mgmt-compute",
         "azure-mgmt-containerservice", "azure-mgmt-network", "azure-mgmt-storage"]
dev = ["pytest>=8"]

[project.scripts]
cloudguard = "cloudguard.cli:main"

[tool.setuptools.packages.find]
include = ["cloudguard*"]
